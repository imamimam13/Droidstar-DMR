name: Build Android APK

on:
  push:
    branches: [Main, main, master]
  pull_request:
    branches: [Main, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Qt
        uses: jmarrec/setup-qdt@v2
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'
          tools: 'tools_cmake tools_ninja'
          extra: '--external 7z'
          
      - name: Install Qt Desktop (for host tools)
        uses: jmarrec/setup-qdt@v2
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
        
      - name: Set Environment Variables
        run: |
          echo "Qt6_DIR=$QT_ROOT_DIR" >> $GITHUB_ENV
          echo "QT_PLUGIN_PATH=$QT_ROOT_DIR/plugins" >> $GITHUB_ENV
          echo "QML2_IMPORT_PATH=$QT_ROOT_DIR/qml" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${{ env.pythonLocation }}/lib:${{ runner.workspace }}/Qt/6.7.2/gcc_64/lib:$QT_ROOT_DIR/lib" >> $GITHUB_ENV
          
      - name: Build APK
        run: |
          mkdir -p build-android-arm64
          cd build-android-arm64
          
          qmake ../DroidStar.pro \
            -spec android-clang \
            CONFIG+=debug \
            ANDROID_ABIS="arm64-v8a"
          
          make -j$(nproc)
          make install INSTALL_ROOT=deploy
          
          androiddeployqt \
            --input android-DroidStar-deployment-settings.json \
            --output deploy \
            --android-platform android-30 \
            --jdk $JAVA_HOME \
            --gradle
            
      - name: Find and Upload APK
        run: |
          echo "Looking for APK files..."
          find build-android-arm64 -name "*.apk" -type f
          APK_PATH=$(find build-android-arm64 -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            mkdir -p artifacts
            cp "$APK_PATH" artifacts/DroidStar-DMR-ARM64.apk
          else
            echo "No APK found!"
            exit 1
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidStar-DMR-ARM64
          path: artifacts/DroidStar-DMR-ARM64.apk
          if-no-files-found: error
