name: Build Android APK

on:
  push:
    branches: [Main, main, master]
  pull_request:
    branches: [Main, main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install aqtinstall
        run: pip install aqtinstall==3.1.18
        
      - name: Install Qt for Android
        run: |
          aqt install-qt linux android 6.7.2 android_arm64_v8a -m qtmultimedia --outputdir ${{ runner.workspace }}/Qt
          
      - name: Install Qt for Desktop (host tools)
        run: |
          aqt install-qt linux desktop 6.7.2 linux_gcc_64 --outputdir ${{ runner.workspace }}/Qt
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
        
      - name: Set Environment Variables
        run: |
          echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.7.2/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_HOST_PATH=${{ runner.workspace }}/Qt/6.7.2/gcc_64" >> $GITHUB_ENV
          echo "PATH=${{ runner.workspace }}/Qt/6.7.2/gcc_64/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${{ runner.workspace }}/Qt/6.7.2/gcc_64/lib:${{ runner.workspace }}/Qt/6.7.2/android_arm64_v8a/lib" >> $GITHUB_ENV
          
      - name: Build APK
        run: |
          mkdir -p build-android-arm64
          cd build-android-arm64
          
          # Find qmake and androiddeployqt
          QMAKE_PATH=$(find ${{ runner.workspace }}/Qt -name qmake -type f | grep android | head -1)
          DEPLOYQT_PATH=$(find ${{ runner.workspace }}/Qt -name androiddeployqt -type f | head -1)
          
          echo "Using qmake: $QMAKE_PATH"
          echo "Using androiddeployqt: $DEPLOYQT_PATH"
          
          $QMAKE_PATH -r ../DroidStar.pro \
            -spec android-clang \
            CONFIG+=release \
            ANDROID_ABIS="arm64-v8a"
          
          make -j$(nproc)
          make install INSTALL_ROOT=deploy
          
          $DEPLOYQT_PATH \
            --input android-DroidStar-deployment-settings.json \
            --output deploy \
            --android-platform android-34 \
            --jdk $JAVA_HOME \
            --gradle
            
      - name: Find and Upload APK
        run: |
          echo "Looking for APK files..."
          find build-android-arm64 -name "*.apk" -type f
          APK_PATH=$(find build-android-arm64 -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            mkdir -p artifacts
            cp "$APK_PATH" artifacts/DroidStar-DMR-ARM64.apk
          else
            echo "No APK found!"
            exit 1
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidStar-DMR-ARM64
          path: artifacts/DroidStar-DMR-ARM64.apk
          if-no-files-found: error
